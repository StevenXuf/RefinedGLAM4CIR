seed: 42
split: test_ood
remove_duplicates: true
missing_gallery_policy: available
image_storage_folders: [train, val, test_id, test_ood]

paths:
  glam_root: /data/data_fxu/GLAM/raw
  cir_file: cir_db.csv
  db_processed_name: db_processed.txt
  output_dir: outputs
  model_cache: .model_cache

runtime:
  gpu_id: 1
  require_cuda: true
  dtype: bfloat16
  num_workers: 4
  cpu_threads: 4

subset:
  query_limit: null

generation:
  model: qwen
  model_id: Qwen/Qwen3-VL-8B-Instruct
  revision: 0c351dd01ed87e9c1b53cbc748cba10e6187ff3b
  batch_size: 8
  text_batch_size: 48
  max_new_tokens: 128
  max_pixels: 200704
  max_target_images: 3
  min_words: 5
  max_words: 15

perturbation:
  operations:
    character_deletion: 'Delete characters inside words: blue -> bue.'
    character_insertion: 'Insert extra letters or digits inside words: blue -> blxue.'
    character_substitution: 'Replace characters with adjacent English QWERTY keys: blue -> blie.'
    adjacent_character_transposition: 'Exchange adjacent characters inside a word, not words: blue ->
      bule.'
    character_repetition: 'Repeat characters inside words: blue -> bllue.'
    space_insertion: 'Insert spaces inside words: blue -> bl ue.'
    space_deletion: 'Remove spaces between words: blue vase -> bluevase.'

  severity_probabilities:
    mild: 0.75
    moderate: 0.20
    severe: 0.04
    extreme: 0.01

  edit_fraction:
    mild: [0.01, 0.03]
    moderate: [0.04, 0.08]
    severe: [0.10, 0.20]
    extreme: [0.30, 1.00]

retrieval:
  model: openclip
  architecture: ViT-B-16
  pretrained: laion2b_s34b_b88k
  batch_size: 64

evaluation:
  top_ks: [1, 5, 10, 50]
  exclude_reference: true

visualization:
  num_examples: 3
  top_k: 5
  image_size: 224
  wrap_width: 29
  dpi: 120
