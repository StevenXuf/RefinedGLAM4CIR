seed: 42
split: test_ood
remove_duplicates: true
missing_gallery_policy: available
image_storage_folders: [train, val, test_id, test_ood]

paths:
  glam_root: /data/data_fxu/GLAM/raw
  cir_file: cir_db.csv
  db_processed_name: db_processed.txt
  output_dir: outputs
  model_cache: .model_cache

runtime:
  gpu_id: 1
  require_cuda: true
  dtype: bfloat16
  num_workers: 4
  cpu_threads: 4

subset:
  query_limit: null

generation:
  model: qwen
  model_id: Qwen/Qwen3-VL-8B-Instruct
  revision: 0c351dd01ed87e9c1b53cbc748cba10e6187ff3b
  batch_size: 8
  max_new_tokens: 128
  max_pixels: 200704
  max_target_images: 3
  min_words: 3
  max_words: 15
  target_words: 6
  modifier_actions: [change, make, replace, find]

perturbation:
  keyboard_language: en
  insertion_characters: abcdefghijklmnopqrstuvwxyz0123456789

  operations:
    - character_deletion
    - character_insertion
    - character_substitution
    - adjacent_character_transposition
    - character_repetition
    - space_insertion
    - space_deletion

  severity_probabilities:
    mild: 0.75
    moderate: 0.20
    severe: 0.04
    extreme: 0.01

  edit_fraction:
    mild: [0.01, 0.03]
    moderate: [0.04, 0.08]
    severe: [0.10, 0.20]
    extreme: [0.30, 1.00]

retrieval:
  model: openclip
  batch_size: 64

  models:
    openclip:
      architecture: ViT-B-16
      pretrained: laion2b_s34b_b88k

    clip:
      model_id: openai/clip-vit-base-patch32
      revision: 3d74acf9a28c67741b2f4f2ea7635f0aaf6f0268

    siglip:
      model_id: google/siglip-base-patch16-224
      revision: 7fd15f0689c79d79e38b1c2e2e2370a7bf2761ed

    siglip2:
      model_id: google/siglip2-base-patch16-224
      revision: 75de2d55ec2d0b4efc50b3e9ad70dba96a7b2fa2

evaluation:
  top_ks: [1, 5, 10, 50]
  exclude_reference: true

visualization:
  num_examples: 3
  top_k: 5
  image_size: 224
  wrap_width: 29
  dpi: 120

modifier_analysis:
  seeds: [42, 43, 44]

  wordcloud:
    width: 1200
    height: 600
    max_words: 150
    background_color: white
    collocations: false
    normalize_plurals: false
